<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Bill #{{ bill.sl_no }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }
    .wrap {
      max-width: 720px;
      margin: 28px auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .field input, .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    .days-preview {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #1d4ed8;
    }
    .btn {
      padding: 9px 16px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-secondary {
      background: #64748b;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Edit Electricity Bill #{{ bill.sl_no }}</h2>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.name == "duration" %}
            <div id="days-calculated-display" class="days-preview">
              Calculated Usage Days: {{ bill.usage_days }} days
            </div>
          {% endif %}
          {% for error in field.errors %}
            <div style="color:#dc2626;font-size:12px;">{{ error }}</div>
          {% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn">Save Bill</button>
      <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>

  <script>
    (function () {
      const input = document.getElementById("id_duration");
      const display = document.getElementById("days-calculated-display");
      if (!input || !display) return;

      const monthMap = {
        jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2,
        apr: 3, april: 3, may: 4, jun: 5, june: 5, jul: 6, july: 6,
        aug: 7, august: 7, sep: 8, sept: 8, september: 8,
        oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11
      };

      function parseDateToken(str) {
        str = str.trim();
        let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
        if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
        return null;
      }

      function parseMonthYear(str) {
        str = str.trim().toLowerCase();
        const parts = str.split(/\s+/);
        if (parts.length === 2 && parts[0] in monthMap && /^\d{4}$/.test(parts[1])) {
          return { year: Number(parts[1]), month: monthMap[parts[0]] };
        }
        return null;
      }

      function daysInMonth(year, monthIdx) {
        return new Date(year, monthIdx + 1, 0).getDate();
      }

      function updateDays() {
        const val = input.value.trim();
        if (!val) {
          display.textContent = "Calculated Usage Days: 30 days";
          return;
        }
        const dayMatch = val.match(/(\d+)\s*days?/i);
        if (dayMatch) {
          display.textContent = "Calculated Usage Days: " + Math.max(Number(dayMatch[1]), 1) + " days";
          return;
        }
        const splitParts = val.split(/\s*(?:\bto\b|\bthrough\b|[-–—]{1,2})\s*/i);
        if (splitParts.length === 2) {
          const d1 = parseDateToken(splitParts[0]);
          const d2 = parseDateToken(splitParts[1]);
          if (d1 && d2) {
            const diff = Math.max(Math.round(Math.abs(d2 - d1) / 86400000), 1);
            display.textContent = "Calculated Usage Days: " + diff + " days";
            return;
          }
          const m1 = parseMonthYear(splitParts[0]);
          const m2 = parseMonthYear(splitParts[1]);
          if (m1 && m2) {
            let start = m1, end = m2;
            if (end.year < start.year || (end.year === start.year && end.month < start.month)) {
              start = m2; end = m1;
            }
            let total = 0;
            let y = start.year, mo = start.month;
            while (y < end.year || (y === end.year && mo <= end.month)) {
              total += daysInMonth(y, mo);
              mo += 1;
              if (mo > 11) { mo = 0; y += 1; }
            }
            display.textContent = "Calculated Usage Days: " + Math.max(total, 1) + " days";
            return;
          }
        }
        const singleM = parseMonthYear(val);
        if (singleM) {
          display.textContent = "Calculated Usage Days: " + daysInMonth(singleM.year, singleM.month) + " days";
          return;
        }
        display.textContent = "Calculated Usage Days: 30 days";
      }

      input.addEventListener("input", updateDays);
      updateDays();
    })();
  </script>
</body>
</html>
